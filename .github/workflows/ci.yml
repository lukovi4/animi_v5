name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd AnimiApp
          xcodegen generate

      - name: Verify Module Boundary
        run: Scripts/verify_module_boundary.sh

      - name: Build TVECore
        run: |
          cd TVECore
          swift build

      - name: Test TVECore
        run: |
          cd TVECore
          # Skip Metal-dependent tests (require GPU not available in CI)
          # Skip known-failing tests (pre-existing issues tracked separately)
          swift test \
            --skip "Metal" \
            --skip "Alpha" \
            --skip "Isolated" \
            --skip "Mask" \
            --skip "ScenePlayerRender" \
            --skip "GPUMask" \
            --skip "testGroupTransform_matrixRotation" \
            --skip "testGroupTransform_matrixScaleAndRotation" \
            --skip "testPrecomp_containerOpacityAffectsSubtree" \
            --skip "testAnim1_frame0_opacityIsZero" \
            --skip "testAnim1_frame15_opacityIsMidpoint"

      - name: Test AnimiApp
        run: Scripts/run_animiapp_tests.sh

      - name: Download Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Build iOS App
        run: |
          DESTINATION="$(Scripts/run_animiapp_tests.sh --print-destination)"
          xcodebuild build \
            -project AnimiApp/AnimiApp.xcodeproj \
            -scheme AnimiApp \
            -destination "$DESTINATION" \
            -configuration Debug \
            -derivedDataPath DerivedDataCI \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Verify Release Bundle Topology
        run: |
          APP_PATH=$(find DerivedDataCI -name "AnimiApp.app" -type d | head -1)
          Scripts/verify_release_bundle.sh "$APP_PATH"

  swiftlint:
    name: SwiftLint
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging
